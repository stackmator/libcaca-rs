[package]
name = "libcaca"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Pure-Rust port of libcaca, the Colour ASCII-Art library (no C dependency)"
license = "WTFPL"
repository = "https://github.com/stackmator/libcaca-rs"
readme = "README.md"
keywords = ["ascii-art", "terminal", "tui", "caca", "graphics"]
categories = ["graphics", "command-line-interface"]

[lib]
name = "libcaca"
path = "src/lib.rs"

[features]
default = ["std"]
# `std` enables the OS-interactive layer: display drivers (terminal, win32),
# the Conio console, file-based helpers and wall-clock timing. Without it the
# crate is `no_std` + `alloc`: the full canvas, codec, dither, font and
# rendering core keeps working (e.g. for embedded or wasm targets).
std = ["dep:libc", "dep:windows-sys"]
# `gui` adds a cross-platform graphical window driver built only from pure-Rust
# crates (winit for windowing/input, softbuffer for presentation). It implies
# `std` and is deliberately opt-in so headless builds stay dependency-free.
gui = ["std", "dep:winit", "dep:softbuffer"]
# `compat` adds the deprecated pre-1.0 compatibility layer (`Compat`). Opt-in
# so programs that do not need the legacy API pay nothing for it.
compat = ["std"]
# `vga` adds emulated VGA text-mode hardware state (80x25 buffer, palette and
# cursor) with the exact blit logic. Pure `alloc`/`core`, no new dependencies.
vga = []
# `dos` adds emulated DOS console state (screen buffer plus the press/release
# event synthesis of the DOS driver). No new dependencies.
dos = ["std"]
# `gl` adds an OpenGL window driver via pure-Rust glutin + glow on a winit
# window. Opt-in; needs a GPU (or software GL) at runtime.
gl = ["std", "dep:winit", "dep:glutin", "dep:glutin-winit", "dep:glow", "dep:raw-window-handle"]
# `cocoa` adds a native macOS window driver via pure-Rust objc2. Opt-in;
# AppKit requires the main thread (see the module docs).
cocoa = ["std", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
# `x11` adds a native X11 window driver via pure-Rust x11rb (Unix only).
x11 = ["std", "dep:x11rb"]
# `compression` enables transparent gzip/ZIP decompression in the `file`
# module (mirroring HAVE_ZLIB_H), backed by pure-Rust flate2 with no C code.
compression = ["std", "dep:flate2"]
# `import` enables image-file decoding in the `import` module (mirroring
# common-image.c, whose Imlib2/BMP loading becomes the pure-Rust `image`
# crate). Used by `trifiller` to dither a texture from a file.
import = ["std", "dep:image"]

[dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
glow = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
image = { version = "0.25", optional = true }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
x11rb = { version = "0.13", optional = true, features = ["xfixes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]

# Examples using the display drivers (or file import) need the `std`
# feature; the pure canvas/codec examples (text, font2tga) build without it.
[[example]]
name = "export"
path = "examples/export.rs"
required-features = ["std"]
[[example]]
