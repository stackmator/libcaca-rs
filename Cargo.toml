[package]
name = "libcaca"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Pure-Rust port of libcaca, the Colour ASCII-Art library (no C dependency)"
license = "WTFPL"
repository = "https://github.com/stackmator/libcaca-rs"
readme = "README.md"
keywords = ["ascii-art", "terminal", "tui", "caca", "graphics"]
categories = ["graphics", "command-line-interface"]

[lib]
name = "libcaca"
path = "src/lib.rs"

[features]
default = ["std"]
# `std` enables the OS-interactive layer: display drivers (terminal, win32),
# the Conio console, file-based helpers and wall-clock timing. Without it the
# crate is `no_std` + `alloc`: the full canvas, codec, dither, font and
# rendering core keeps working (e.g. for embedded or wasm targets).
std = ["dep:libc", "dep:windows-sys"]

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]

# Examples using the display drivers (or file import) need the `std`
# feature; the pure canvas/codec examples (text, font2tga) build without it.
